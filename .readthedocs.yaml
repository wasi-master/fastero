# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build on a supported, long-term-stable Ubuntu image
# ubuntu-24.04 is supported until at least 2029
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build documentation with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Pin all Python dependencies to avoid breakage from upstream changes
python:
  install:
    - requirements: requirements-docs.txt
    - method: pip
      path: .
